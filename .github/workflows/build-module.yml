name: Build Module

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 19 + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 llvm-19-dev lld-19 libelf-dev zlib1g-dev
          echo "/usr/lib/llvm-19/bin" >> $GITHUB_PATH

      - name: Setup Rust nightly + targets
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup target add bpfel-unknown-none --toolchain nightly
          rustup target add aarch64-linux-android

      - name: Install bpf-linker
        env:
          LLVM_SYS_190_PREFIX: /usr/lib/llvm-19
        run: |
          cargo install bpf-linker --locked || cargo install bpf-linker

      - name: Build eBPF program
        env:
          LLVM_SYS_190_PREFIX: /usr/lib/llvm-19
        run: |
          cd ebpf
          cargo +nightly build --target bpfel-unknown-none --release -Zbuild-std=core
          cp target/bpfel-unknown-none/release/aether-ebpf ../ebpf_target.o
          ls -la ../ebpf_target.o

      - name: Setup Android NDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: 25.2.9519653

      - name: Build + package module
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/ndk/25.2.9519653
        run: |
          python3 build.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aether-optext-module
          path: out/*.zip
